[tool.poetry]
name = "marn"
version = "0.1.0"
description = ""
authors = ["Arjun Manjunath <dev.arjunmnath@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"

packages = [
    { include = "marn", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14.1 || >3.14.1,<3.15"
torch = ">=2.6,<3.0"
pydantic = ">=2.0"
pyyaml = "^6.0.3"
torchvision = "^0.27.1"
accelerate = ">=0.30"
scikit-learn = "^1.9.0"
matplotlib = "^3.11.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.12"
mypy = "^1.16"
pre-commit = "^4.2"
types-pyyaml = "^6.0.12.20260518"


[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
myst-parser = "^5.1.0"
pydata-sphinx-theme = "^0.15.2"
sphinx-autobuild = "^2025.8.25"


[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "torchvision.*",
    "accelerate.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
